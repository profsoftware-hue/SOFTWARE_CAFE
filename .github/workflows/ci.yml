name: CI

on:
  push:
    branches: [main, desarrollo, produccion]
  pull_request:
    branches: [main, desarrollo]

jobs:
  backend:
    name: Backend (compilación y pruebas unitarias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Compilar
        run: python -m compileall backend/app
      - name: Pruebas
        env:
          PYTHONPATH: backend
        run: pytest backend/tests -q

  frontend:
    name: Frontend (build, lint y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Pruebas unitarias
        run: npm run test

  integration:
    name: Integración PostgreSQL (migración + venta + cierre)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: software_cafe_test
          POSTGRES_USER: ccp_test
          POSTGRES_PASSWORD: ccp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccp_test -d software_cafe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ccp_test:ccp_test@localhost:5432/software_cafe_test
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: software_cafe_test
      DB_USER: ccp_test
      DB_PASSWORD: ccp_test
      DB_DIALECT: postgresql
      SECRET_KEY: test-secret-key-with-more-than-32-characters
      ENVIRONMENT: test
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Migrar base de datos
        working-directory: backend
        run: alembic upgrade head
      - name: Pruebas unitarias y de integración
        env:
          PYTHONPATH: backend
        run: pytest backend/tests -q
